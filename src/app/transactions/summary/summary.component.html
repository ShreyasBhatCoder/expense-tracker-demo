<div class="space-y-1">
    <h3 class="text-lg font-semibold text-slate-900 dark:text-slate-100">Purchase Summary</h3>
    <p class="text-xs text-slate-500 dark:text-slate-400">Final tally of all your purchases.</p>
</div>

<!-- Divider Line -->
<div class="border-t border-slate-100 dark:border-slate-800 my-2"></div>

<!-- Metrics Breakdown Grid -->
<div class="grid grid-cols-2 gap-4 text-sm">
    <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Total Items</p>
        <p class="text-base font-bold text-slate-800 dark:text-slate-200 mt-0.5">{{ tx_list().length }}</p>
    </div>
    <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Average Spend</p>
        <p class="text-base font-bold text-slate-800 dark:text-slate-200 mt-0.5">{{ this.averageSpend | currency:
            "INR"}}</p>
    </div>
</div>

<!-- Graph/chart -->
<div>
    <!-- Fix: Canvas wrapper container with relative position and strict height constraint -->
    <div class="relative h-50 w-full">
        <canvas baseChart [data]="data()" [options]="chartOptions">
        </canvas>
    </div>
</div>

<!-- Prominent Total Display -->
<div
    class="flex items-center justify-between p-4 bg-indigo-50/50 dark:bg-indigo-950/30 rounded-xl border border-indigo-100/50 dark:border-indigo-900/30">
    <p class="text-sm font-medium text-slate-700 dark:text-slate-300">Total Expense</p>
    <!-- Best Practice: Angular Currency Pipe handles formatting & symbols natively -->
    <span class="font-extrabold text-xl text-indigo-700 dark:text-indigo-400">
        {{ this.getCumulativeSum | currency:'INR':'symbol':'1.0-0' }}
    </span>
</div>
