
<div class="space-y-1">
    <h3 class="text-lg font-semibold text-slate-900">Purchase Summary</h3>
    <p class="text-xs text-slate-500">Final tally of all your purchases.</p>
</div>

<!-- Divider Line -->
<div class="border-t border-slate-100 my-2"></div>

<!-- Metrics Breakdown Grid -->
<div class="grid grid-cols-2 gap-4 text-sm">
    <div class="bg-slate-50 p-3 rounded-xl">
        <p class="text-xs text-slate-500 font-medium">Total Items</p>
        <p class="text-base font-bold text-slate-800 mt-0.5">{{ tx_list().length }}</p>
    </div>
    <div class="bg-slate-50 p-3 rounded-xl">
        <p class="text-xs text-slate-500 font-medium">Average Spend</p>
        <p class="text-base font-bold text-slate-800 mt-0.5">₹{{ this.averageSpend() }}</p>
    </div>
</div>

<!-- Graph/chart -->
<div>
    <canvas 
        baseChart 
        [data]="data()">
    </canvas>
</div>

<!-- Prominent Total Display -->
<div class="flex items-center justify-between p-4 bg-indigo-50/50 rounded-xl border border-indigo-100/50">
    <p class="text-sm font-medium text-slate-700">Total Expense</p>
    <!-- Best Practice: Angular Currency Pipe handles formatting & symbols natively -->
    <span class="font-extrabold text-xl text-indigo-700">
        {{ this.getCumulativeSum() | currency:'INR':'symbol':'1.0-0' }}
    </span>
</div>
