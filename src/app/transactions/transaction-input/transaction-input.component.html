<form (ngSubmit)="onSubmit(item.value, amount.value)" #form>
    <!-- Form Title / Optional Header -->
    <div class="space-y-1">
        <h3 class="text-lg font-semibold text-slate-900">Log New Expense</h3>
        <p class="text-xs text-slate-500">Enter details below to update your purchase tracker.</p>
    </div>

    <!-- Purchase Item Input Group -->
    <div class="space-y-1.5">
        <label for="purchase-item" class="text-xs font-semibold text-slate-700 tracking-wide">Purchase Item</label>
        <input type="text" id="purchase-item" name="purchase-item" placeholder="e.g., Wireless Mouse"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"
            required #item/>
    </div>

    <!-- Amount Spent Input Group -->
    <div class="space-y-1.5">
        <label for="amount-spent" class="text-xs font-semibold text-slate-700 tracking-wide">Amount Spent</label>
        <div class="relative">
            <!-- Currency Symbol Indicator -->
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-slate-400 text-sm font-medium">₹</span>
            </div>
            <input type="number" id="amount-spent" pattern="[0-9]*" min="0" name="amount-spent" placeholder="0.00"
                class="w-full pl-8 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-indigo-100 outline-none transition-all [appearance:textfield]"
                required #amount />
        </div>
    </div>

    <!-- Action Buttons Group -->
    <div class="flex items-center gap-3 pt-3">
        <button type="submit"
            class="flex-1 px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-lg shadow-sm transition-colors cursor-pointer">
            Submit Expense
        </button>
        <button type="reset"
            class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm border border-slate-200 rounded-lg transition-colors cursor-pointer">
            Reset
        </button>
    </div>
</form>
