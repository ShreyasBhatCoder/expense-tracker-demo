<div class="flex flex-col">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Purchase History</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">Keep track of all your purchases, and the cumulative amount
        you've spent.</p>
</div>

<div class="overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm mt-5">

    <table class="w-full max-h-70 flex flex-col text-left text-sm text-slate-600 dark:text-slate-400">

        <!-- Header: Evenly split block layout -->
        <thead
            class="w-full bg-slate-50 dark:bg-slate-800/60 text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800">
            <tr class="flex w-full">
                <!-- Using basis-1/3 to force exactly equal width shares -->
                <th scope="col" class="basis-1/3 px-6 py-4">Recent Purchase</th>
                <th scope="col" class="basis-1/3 px-6 py-4 text-left">Date of Purchase</th>
                <th scope="col" class="basis-1/3 px-6 py-4 text-right">Amount</th>
                <!-- Fixed scrollbar spacer alignment -->
                <th scope="col" class="w-2.5 p-0"></th>
            </tr>
        </thead>

        <!-- Scrollable Body: Matches header widths exactly -->
        <tbody
            class="w-full flex flex-col overflow-y-auto max-h-75 divide-y divide-slate-100 dark:divide-slate-800/60 font-medium">
            @for(log of sortedTxList(); track log.id) {
            <tr class="flex w-full hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                <!-- Matching basis-1/3 classes on cell data blocks -->
                <td class="basis-1/3 px-6 py-4 text-slate-900 dark:text-slate-200 truncate">{{ log.itemName }}</td>
                <td class="basis-1/3 px-6 py-4 text-left tabular-nums">{{ log.dateOfPurchase | date: "medium" }}
                </td>
                <td class="basis-1/3 px-6 py-4 text-right tabular-nums text-slate-900 dark:text-slate-200">₹{{
                    log.amountSpent }}</td>
            </tr>
            }
        </tbody>

    </table>

</div>
