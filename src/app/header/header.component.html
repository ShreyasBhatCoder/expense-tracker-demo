<div class="w-full px-6 py-4 flex flex-row justify-between items-center bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800/80 shadow-sm/50 transition-colors duration-200">
    
    <!-- Title Section -->
    <div class="space-y-0.5">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-50">
            Transaction Dashboard
        </h1>
        <p class="hidden sm:block text-xs font-medium text-slate-400 dark:text-slate-500">
            Manage your budget and track daily expenses
        </p>
    </div>
    
    <!-- Interactive Theme Controller Switcher Container -->
    <div class="flex items-center gap-3 px-3 py-1.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800/60 select-none transition-all">
        
        <!-- Status Icon Container with active text highlighters -->
        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 shadow-sm border border-slate-100 dark:border-slate-800/30">
            <mat-icon class="text-[18px] w-4 h-4 flex items-center justify-center transition-transform duration-300" 
                      [class.rotate-45]="themeService.isDarkMode()">
                {{ themeService.isDarkMode() ? 'dark_mode' : 'light_mode' }}
            </mat-icon>
        </div>
        
        <!-- Angular Material Slide Toggle Control -->
        <mat-slide-toggle 
            [checked]="themeService.isDarkMode()" 
            (change)="themeService.toggleDarkMode()"
            class="cursor-pointer scale-90 shrink-0 custom-header-toggle">
        </mat-slide-toggle>

    </div>
</div>
